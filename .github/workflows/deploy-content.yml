name: Deploy content

# TR-0.5.2: publishes /content/v1/* and /config/v1/* to GitHub Pages. See the header comment on
# scripts/generate-remote-content.sh for what is generated versus copied, and Q-0.3 in
# docs/phase-0/open-questions.md for why GitHub Pages was chosen over Cloudflare Pages and
# S3 + CloudFront.
#
# Runs on every push to main touching the sources these payloads are built from, plus a manual
# trigger for a content-only republish — bumping GenerateRemoteContent's `revision` literal, or
# swapping RPETable.standard for a sourced chart, with no other code change to land.
#
# GitHub Pages fixes its own Cache-Control (~600s, via its Fastly front end) and does not accept a
# `_headers`-style override — the trade-off Q-0.3 weighs against Cloudflare Pages. 600s is short
# enough for TR-0.5.4's kill switch to take effect in.
#
# Requires GitHub Pages enabled for this repository with source = GitHub Actions
# (Settings → Pages → Build and deployment → Source) — a one-time change only the repository
# owner can make, and this workflow cannot make it.

on:
  push:
    branches: [main]
    paths:
      - "Packages/SeedContent/Sources/SeedContent/Resources/exercises.json"
      - "Packages/PowerliftingCore/Sources/PowerliftingCore/RPETable*.swift"
      - "Packages/RemoteContent/**"
      - "scripts/generate-remote-content.sh"
      - ".github/workflows/deploy-content.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialised with itself, not with the CI workflow: two content pushes racing here would let the
# older one publish last, which two pushes racing in ci.yml's `build`/`test` do not risk.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build content
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Generate content
        run: ./scripts/generate-remote-content.sh Content

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Content

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
