name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild build \
            -project Attempt.xcodeproj \
            -scheme Attempt \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions || exit ${PIPESTATUS[0]}

  # G-6.3: tests run on every push, and this job failing blocks the merge.
  # Runs the packages directly with SwiftPM rather than through the Xcode scheme — the packages
  # are not linked into Attempt.xcodeproj yet (deferred to T-0.03), and the domain suite has no
  # reason to need a simulator.
  #
  # Also carries T-0.06's G-6.4 gates. Warnings-as-errors needs no flag here — every target sets
  # `.treatAllWarnings(as: .error)` in its manifest, so `swift build`/`swift test` fail on a
  # warning wherever they run, CI and desk alike.
  #
  # macos-26, not the macos-15 used by the jobs around it: the manifests are tools-version 6.2
  # (required by the .iOS(.v26) decision in Q-0.1) and macos-15 ships Xcode 16.x, which fails at
  # manifest parse. Bumping the other two jobs is T-0.07.
  test:
    name: Package tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain version
        run: swift --version

      # Also runs the PowerliftingCore suite — the script tests before it measures.
      # The threshold stays at its default of 0 until T-0.61 raises it to the G-6.1 90%.
      - name: Test PowerliftingCore and report coverage
        run: ./scripts/coverage.sh --package-path Packages/PowerliftingCore

      - name: Test Persistence
        run: swift test --package-path Packages/Persistence

      # G-6.4: DesignSystem has no test target (it has no code — see coverage.md "Known gaps" §1),
      # so nothing above would ever compile it. Built explicitly, or its manifest's
      # warnings-as-errors setting would be enforced on no one.
      - name: Build DesignSystem
        run: swift build --package-path Packages/DesignSystem

      # G-6.4: `@unchecked Sendable` needs a written justification. Runs here rather than in the
      # `lint` job because `lint` is on macos-15 and red until T-0.07 — a gate in a job that never
      # passes is not a gate. Moving it next to SwiftLint is fair game once T-0.07 fixes that.
      - name: Audit @unchecked Sendable
        run: ./scripts/audit-unchecked-sendable.sh

  # TR-0.1.1 / NFR-0.2 / DOD-0.2: the mechanical proof that no *Apple-platform* framework leaked
  # into the domain layer. An `import SwiftUI` or `import SwiftData` in PowerliftingCore compiles
  # perfectly well on Darwin, so every other job in this file stays green while the constraint is
  # being violated. This job is the only one that notices.
  #
  # KNOWN LIMIT, do not overstate this job: it does NOT catch `import Foundation`.
  # Foundation ships on Linux (swift-corelibs-foundation), so Foundation — and Date, UUID, Data
  # with it — compiles here and this job stays green. NFR-0.2 as written also forbids Foundation
  # in the core; that half is enforced by review only, until a lint rule covers it (T-0.05).
  # Treating a green run here as proof of "Foundation-free" is the one wrong conclusion to draw.
  #
  # Builds PowerliftingCore ONLY. Persistence (SwiftData) and DesignSystem (SwiftUI) are
  # Apple-only by design and are not expected to compile here — adding them would turn a
  # requirement into a permanent red job.
  #
  # The image tag is pinned to an exact patch version, not `swift:latest` and not `swift:6.3`:
  #   - This package's manifest is tools-version 6.2 and uses `.defaultIsolation(nil)` and
  #     `.treatAllWarnings(as:)`, both PackageDescription 6.2 APIs. (The `.iOS(.v26)` that forces
  #     6.2 elsewhere is deliberately absent here — PowerliftingCore declares no `platforms:`.)
  #     An older image fails at manifest parse, before it reaches a single line of code — a
  #     confusing way to go red.
  #   - Warnings are errors on this job too, from `.treatAllWarnings(as: .error)` in the
  #     manifest. A floating tag can introduce a new diagnostic with no commit behind it, and
  #     that lands hardest here, where the Linux toolchain is not the compiler anyone ran at
  #     their desk. Bump this tag deliberately, in its own commit.
  #     The tag still floats over base-OS rebuilds — only a `swift@sha256:...` digest is truly
  #     immutable — but it fixes the *compiler* version, which is what decides the diagnostics.
  # Do NOT reach for `-Xswiftc -no-warnings-as-errors` if this job reddens on a warning: it
  # would exempt the one job DOD-0.2 depends on. Fix the warning.
  linux:
    name: Linux core build
    runs-on: ubuntu-latest
    container: swift:6.3.3-noble
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain version
        run: swift --version

      # Two steps rather than one, though `swift test` would build the target anyway: it
      # separates the signal. A red build step means Apple API reached Sources/ — the NFR-0.2
      # violation this job exists to catch. A red test step means something else.
      - name: Build PowerliftingCore
        run: swift build --package-path Packages/PowerliftingCore

      - name: Test PowerliftingCore
        run: swift test --package-path Packages/PowerliftingCore

      # Deliberately NOT run here (T-0.08 notes):
      #   scripts/coverage.sh              — needs python3, which the Swift images do not
      #                                      reliably ship. Coverage is measured once, on macOS.
      #   scripts/audit-unchecked-sendable.sh — toolchain-independent and already in `test`.
      # Both would give this job a second way to fail for reasons that have nothing to do with
      # Linux, which is the one thing it is here to tell us about.

  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging
