name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      # G-6.4 (T-0.03): the app target's four Swift settings live in a hand-managed `.pbxproj`,
      # because TR-0.6.3's generator was deferred to Phase 1. A regression there is invisible in
      # review, so it is asserted rather than trusted. Runs before the build: if the settings have
      # drifted, that is more useful to know than whatever the build does next.
      - name: Audit app-target build settings
        run: ./scripts/audit-app-build-settings.sh

      # No SUPPRESS_WARNINGS workaround here any more. It was needed while the manifests carried
      # `.treatAllWarnings(as: .error)`, which conflicted with the `-suppress-warnings` Xcode
      # injects into package dependencies. T-0.03 moved the warnings gate to command-line flags
      # (scripts/swift-strict-flags.sh) precisely so this job — and a plain Xcode build — work
      # unaided. The app target's own SWIFT_TREAT_WARNINGS_AS_ERRORS still applies to app code.
      - name: Build
        run: |
          xcodebuild build \
            -project Attempt.xcodeproj \
            -scheme Attempt \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions || exit ${PIPESTATUS[0]}

  # G-6.3: tests run on every push, and this job failing blocks the merge.
  # Runs the packages directly with SwiftPM rather than through the Xcode scheme. The packages
  # are linked into Attempt.xcodeproj as of T-0.03, but a domain suite has no reason to need a
  # simulator, and SwiftPM gives a far faster and clearer failure.
  #
  # Also carries T-0.06's G-6.4 gates. Warnings-as-errors DOES need a flag here as of T-0.03 —
  # it is no longer in the manifests. Every invocation goes through scripts/, which sources the
  # single definition in scripts/swift-strict-flags.sh. Do not add a bare `swift build` or
  # `swift test` step to this job; it would silently escape the gate.
  #
  # Every macOS job is on macos-26 as of 2026-08-02. It is not optional here: the manifests are
  # tools-version 6.2 (required by the .iOS(.v26) decision in Q-0.1) and macos-15 ships Xcode
  # 16.x, which fails at manifest parse before reaching any code.
  test:
    name: Package tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain version
        run: swift --version

      # Also runs the PowerliftingCore suite — the script tests before it measures.
      # The threshold stays at its default of 0 until T-0.61 raises it to the G-6.1 90%.
      - name: Test PowerliftingCore and report coverage
        run: ./scripts/coverage.sh --package-path Packages/PowerliftingCore

      # G-6.4: every package built and tested with warnings-as-errors, discovered by glob rather
      # than listed — a new package under Packages/ is covered the moment it exists. This also
      # subsumes the old explicit "Build DesignSystem" step: a package with no test target is
      # otherwise never compiled, so its warnings would be enforced on nobody.
      # PowerliftingCore's suite runs here as well as under coverage.sh above; the overlap is
      # deliberate and costs milliseconds, and keeps the gate in exactly one place.
      - name: Build and test all packages with warnings as errors
        run: ./scripts/build-packages.sh --test

      # NFR-0.1: the core suite under 5 seconds. Runs after the step above, so the package is
      # already built and this measures execution rather than compilation.
      #
      # An architectural tripwire, not a performance gate — it sits ~100x above the current
      # reading, and the script's header explains at length why that is the right budget rather
      # than an unfired one. Read it before reacting to a failure here: the thing that closes a
      # 100x gap is I/O arriving in the domain layer, not more tests.
      - name: Check core suite runtime
        run: ./scripts/check-suite-runtime.sh

      # And the proof that the gate above can fail, since nothing in normal operation will ever
      # make it. Seven negative cases, two positive. The negatives assert *which* failure fired,
      # not merely that one did — a mutation probe found the ambiguity check could be deleted
      # while the suite stayed green, because another branch caught the fixture and misdiagnosed
      # it. A gate nobody has watched fail is decoration; one watched failing for the wrong
      # reason is worse.
      - name: Verify the runtime gate fires
        run: ./scripts/check-suite-runtime.sh --self-test

      # G-6.4: proves the flags above still turn a warning into a failure, by building a fixture
      # that warns — once without the flags expecting success, once with them expecting failure.
      # Without this, a typo in the flag name leaves every build green and nothing enforced.
      - name: Verify the warnings gate fires
        run: ./scripts/verify-warnings-gate.sh

      # G-6.4: `@unchecked Sendable` needs a written justification. It lives here rather than in
      # `lint` for historical reasons — `lint` was on macos-15 and believed red, and a gate in a
      # job that never passes is not a gate. Both premises are gone now, so it *could* move next
      # to SwiftLint — T-0.05 has since widened `.swiftlint.yml`'s `included:` to cover
      # `Packages/`, so the objection that `lint` proved nothing about them no longer holds.
      # Moving it is T-0.07's call, not a drive-by.
      - name: Audit @unchecked Sendable
        run: ./scripts/audit-unchecked-sendable.sh

  # TR-0.1.1 / NFR-0.2 / DOD-0.2: the mechanical proof that no *Apple-platform* framework leaked
  # into the domain layer. An `import SwiftUI` or `import SwiftData` in PowerliftingCore compiles
  # perfectly well on Darwin, so every other job in this file stays green while the constraint is
  # being violated. This job is the only one that notices.
  #
  # KNOWN LIMIT, do not overstate this job: it does NOT catch `import Foundation`.
  # Foundation ships on Linux (swift-corelibs-foundation), so Foundation — and Date, UUID, Data
  # with it — compiles here and this job stays green. NFR-0.2 also forbids Foundation in the core;
  # that half is covered by T-0.05's `no_foundation_in_core` SwiftLint rule, in the `lint` job.
  # Treating a green run *here* as proof of "Foundation-free" is still the wrong conclusion — the
  # two jobs enforce different halves and neither substitutes for the other.
  #
  # Builds PowerliftingCore and RepositoryInterface. Persistence (SwiftData) and DesignSystem
  # (SwiftUI) are Apple-only by design and are not expected to compile here — adding them would
  # turn a requirement into a permanent red job.
  #
  # RepositoryInterface was added by T-0.40, and it is not a second domain package riding along:
  # this job is the ONLY mechanism that can check TR-0.1.2's "no feature module imports SwiftData".
  # SwiftData ships in the Apple SDKs, so on Darwin every target can import it and no arrangement
  # of targets proves anything about linkage; here the module does not exist, so an import — or a
  # dependency edge back to Persistence — is a build failure. That package therefore declares no
  # `platforms:` clause, for the same reason PowerliftingCore does not. A macOS/iOS floor would
  # take it out of this job and leave the requirement enforced by review again.
  #
  # KNOWN LIMIT on that claim, stated so it is not overread: this proves the package does not
  # depend on SwiftData. It does not prove a *feature* module reaches storage only through these
  # protocols — that half is `no_swiftdata_outside_persistence` in the lint job.
  #
  # Do NOT rename this job to describe the second package. GitHub drops a renamed job from the
  # branch-protection rule silently: the old name stays listed and never reports again.
  #
  # The image tag is pinned to an exact patch version, not `swift:latest` and not `swift:6.3`:
  #   - This package's manifest is tools-version 6.2 and uses `.defaultIsolation(nil)`, a
  #     PackageDescription 6.2 API. (The `.iOS(.v26)` that forces 6.2 elsewhere is deliberately
  #     absent here — PowerliftingCore declares no `platforms:`.) An older image fails at manifest
  #     parse, before it reaches a single line of code — a confusing way to go red.
  #   - Warnings are errors on this job too, via the flags in scripts/swift-strict-flags.sh, which
  #     is why the steps below go through the script. A floating tag can introduce a new
  #     diagnostic with no commit behind it, and
  #     that lands hardest here, where the Linux toolchain is not the compiler anyone ran at
  #     their desk. Bump this tag deliberately, in its own commit.
  #     The tag still floats over base-OS rebuilds — only a `swift@sha256:...` digest is truly
  #     immutable — but it fixes the *compiler* version, which is what decides the diagnostics.
  # Do NOT reach for `-Xswiftc -no-warnings-as-errors` if this job reddens on a warning: it
  # would exempt the one job DOD-0.2 depends on. Fix the warning.
  linux:
    name: Linux core build
    runs-on: ubuntu-latest
    container: swift:6.3.3-noble
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain version
        run: swift --version

      # Two steps rather than one, though `swift test` would build the target anyway: it
      # separates the signal. A red build step means Apple API reached Sources/ — the NFR-0.2
      # violation this job exists to catch. A red test step means something else.
      - name: Build PowerliftingCore
        run: ./scripts/build-packages.sh Packages/PowerliftingCore

      - name: Test PowerliftingCore
        run: ./scripts/build-packages.sh --test Packages/PowerliftingCore

      # TR-0.1.2 / TR-0.4.1. Separate steps for the same reason as the two above: a red build here
      # means SwiftData — or a dependency on Persistence — reached the storage boundary, which is
      # the violation this package exists to make impossible. A red test step means something else.
      - name: Build RepositoryInterface
        run: ./scripts/build-packages.sh Packages/RepositoryInterface

      - name: Test RepositoryInterface
        run: ./scripts/build-packages.sh --test Packages/RepositoryInterface

      # Deliberately NOT run here (T-0.08 notes):
      #   scripts/coverage.sh              — needs python3, which the Swift images do not
      #                                      reliably ship. Coverage is measured once, on macOS.
      #   scripts/audit-unchecked-sendable.sh — toolchain-independent and already in `test`.
      # Both would give this job a second way to fail for reasons that have nothing to do with
      # Linux, which is the one thing it is here to tell us about.

  # TR-0.6.2 / G-7.7 / TR-0.1.2 / NFR-0.2 (T-0.05).
  #
  # As of 2026-08-02 this job means something: `.swiftlint.yml`'s `included:` covers `Packages/`
  # as well as `Attempt/`. Before that it was `[Attempt]` alone, so a green run here said nothing
  # whatsoever about the packages — worth remembering if you are tempted to move a gate into this
  # job on the strength of it being green.
  lint:
    name: SwiftLint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging

      # Proves the configured rules actually fire, against fixtures that violate them on purpose,
      # plus guards that the import bans do NOT fire on comments that merely mention one. A rule
      # with a broken regex or a path filter matching nothing leaves the step above green while
      # enforcing nothing — that failure mode is invisible because it looks like success.
      #
      # `missing_docs` (NFR-0.3) is covered here as well as the custom rules, because a built-in
      # whose *default* configuration is the hole needs the same proof a broken regex does.
      - name: Verify lint rules fire
        run: ./scripts/verify-lint-rules.sh

      # TR-0.6.2's formatter half. `swift format` ships with the toolchain, so there is nothing to
      # install. Config is `.swift-format`: 4-space indent and a 120-column limit, matching
      # `.editorconfig` and SwiftLint's `line_length` rather than the tool's own defaults.
      - name: Check formatting
        run: swift format lint --strict --recursive Attempt Packages

      # Holds the doc-comment trim in place: `///` lines against code lines across every
      # Packages/*/Sources tree, aggregated. Deliberately not per-file — that would measure how
      # declarative a file is rather than how wordy it is, and an eight-case enum cannot document
      # what its cases mean inside a 1:1 budget. Proven to fire against a 300-line regression.
      - name: Check doc-comment ratio
        run: ./scripts/check-doc-ratio.sh

      # NFR-0.3's other half: `missing_docs` gates whether a doc comment exists, this gates whether
      # it says what the number is measured in and which values are legal. A proxy, and its own
      # header says so.
      - name: Check documented units and ranges
        run: ./scripts/check-doc-units.sh

      # OUT-0.2, G-1.7 and the half of DOD-0.4 that a test cannot see: no iCloud entitlement, no
      # source naming a CloudKit database, no custom migration stage, and every @Model actually in
      # the audited list. The schema audit itself is CloudKitCompatibilityTests in the test job.
      - name: Check CloudKit stays compatible, not enabled
        run: ./scripts/check-cloudkit.sh

      - name: Verify the CloudKit gate fires
        run: ./scripts/check-cloudkit.sh --self-test
