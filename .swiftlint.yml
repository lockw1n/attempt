# T-0.05. `included` covers the app target AND every package — before 2026-08-02 it was
# `[Attempt]` alone, so a green `swiftlint lint --strict` said nothing whatsoever about
# Packages/. Anything added under Packages/ is linted from now on.
#
# scripts/lint-fixtures/ is deliberately absent from both lists. It holds files that violate the
# custom rules on purpose, so it must not be linted by a normal run — but it must still be
# lintable when named explicitly on the command line, which `excluded` would prevent.
# scripts/verify-lint-rules.sh does exactly that, and proves each rule below actually fires.
included:
  - Attempt
  - Packages

excluded:
  - Attempt/Assets.xcassets
  - DerivedData
  - .build
  - Packages/PowerliftingCore/.build
  - Packages/Persistence/.build
  - Packages/RepositoryInterface/.build
  - Packages/DesignSystem/.build

disabled_rules:
  - todo
  - trailing_comma

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - force_unwrapping
  - implicit_return
  - joined_default_parameter
  - last_where
  - literal_expression_end_indentation
  - missing_docs
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 300
  error: 450

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 60
  error: 100

cyclomatic_complexity:
  warning: 12
  error: 20

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - x
    - y
    - z
    - to
    - up

nesting:
  type_level: 2

# T-0.23, NFR-0.3. Three of these four settings differ from the rule's defaults, and the first is
# the difference between a gate and decoration.
#
#   excludes_inherited_types  MUST stay false. At its default of `true` the rule skips any type
#                             carrying a conformance clause *together with all of its members*, and
#                             every type in PowerliftingCore conforms to at least Sendable — so at
#                             the default it gates nothing in the module it was added for. The
#                             measurement behind that, and the fixture that keeps it honest, are in
#                             scripts/lint-fixtures/.../MissingDocsFixture.swift.
#   excludes_extensions       false. Free when set, and it closes the hole where a Codable
#                             conformance, which lives in an extension here, lands undocumented.
#   excludes_trivial_init     false, its default, stated so nobody relaxes it as housekeeping. A
#                             `public init()` has to say which defaults it picks.
#   error rather than warning matches every custom rule below: --strict promotes warnings anyway, and
#                             a gate that reads as advisory in the config is just confusing.
#
# Scope is the whole repo, deliberately: built-in rules take no path filter, and the nested-config
# alternative breaks the fixture that proves this one fires. Phase 1's public view surface inherits
# it.
#
# This rule measures the *presence* of a doc comment. NFR-0.3 also asks for units and valid ranges,
# which nothing mechanical can read; scripts/check-doc-units.sh is the guard for that half.
missing_docs:
  excludes_inherited_types: false
  excludes_extensions: false
  excludes_trivial_init: false
  error: [open, public]

# ---------------------------------------------------------------------------------------------
# Custom rules (T-0.05)
#
# Two groups with different jobs:
#
#   G-7.7   — no hard-coded colours, font sizes or spacing in UI that consumes the design system.
#             Feature modules do not exist yet; these are written against the path they will
#             occupy (Packages/Features/...) plus the app target, so they are in place *before*
#             Phase 1 can break them. DesignSystem itself is excluded — it is where the raw
#             values are legitimately defined.
#
#   NFR-0.2 — `no_imports_in_core` (T-0.14) bans *every* import under
#             Packages/PowerliftingCore/Sources/, not a list of named modules. It exists because
#             `no_foundation_in_core` below matches only `Foundation*`, so the workaround for a
#             missing `pow` — `#if canImport(Darwin) import Darwin #elseif canImport(Glibc) …` —
#             compiled clean, passed `--strict`, and would have passed the Linux job too, while
#             being exactly the violation NFR-0.2 is about. Verified 2026-08-04. An enumerated
#             blocklist cannot anticipate the next platform module; "nothing at all" can, and it is
#             the property the coverage matrix actually cites as evidence. The Tests target is
#             deliberately out of scope — it needs `import Testing`.
#
#   layering — TR-0.1.2 and NFR-0.2, the three import bans. All three rely on `match_kinds` to
#             tell code from prose: `import Foundation` and `import SwiftData` both appear inside
#             *comments* in this repo (PowerliftingCore.swift and Persistence.swift document the
#             rules they are subject to). A comment's syntax kind is `comment`, which is not in
#             the list, so those cannot match; nor can a string literal, whose kind is `string`.
#             Without it the rules would fire on the very files that explain them.
#
#             `match_kinds` is now the ONLY thing doing that job, which was not true before
#             2026-08-04. All three regexes used to start `^[ \t]*import`, and that anchor did
#             most of the prose filtering. It also left a hole: an *attributed* import does not
#             start with `import`, so `@_exported import Foundation` in the domain core compiled,
#             passed all three rules under `--strict`, and would have passed the Linux job. Found
#             reviewing T-0.14 and measured. The anchor is gone, `\bimport[ \t]+…` matches
#             anywhere, and AttributedImportFixture.swift is the regression test. Do not
#             reintroduce the anchor, and do not drop `match_kinds` — BlockCommentImportFixture
#             .swift guards the second half and fires the moment it is removed.
#
# Every rule here is `error`, not `warning`: `--strict` promotes warnings anyway, and a rule that
# reads as advisory in the config but fails the build in CI is just confusing.
#
# scripts/verify-lint-rules.sh proves each of these fires. A rule nobody has seen fail is not
# coverage, it is decoration.
custom_rules:
  no_color_literals:
    name: "Hard-coded colour"
    regex: '(#colorLiteral\(|\bUIColor\(\s*(red|white|hue):|\bNSColor\(\s*(red|white|hue):|\bColor\(\s*(red|white|hue):)'
    included:
      - 'Attempt/.*\.swift'
      - 'Packages/Features/.*\.swift'
    message: "G-7.7: use a DesignSystem colour token, not a literal colour."
    severity: error

  no_raw_font_sizes:
    name: "Hard-coded font size"
    regex: '(\.system\(\s*size:|\.systemFont\(\s*ofSize:|Font\.custom\([^)]*,\s*size:|\.monospacedSystemFont\(\s*ofSize:)'
    included:
      - 'Attempt/.*\.swift'
      - 'Packages/Features/.*\.swift'
    message: "G-7.7: use a DesignSystem typography token, not a raw point size."
    severity: error

  no_magic_spacing:
    name: "Magic spacing value"
    regex: '(\.padding\(\s*-?\d+(\.\d+)?\s*\)|\.padding\(\s*\.\w+\s*,\s*-?\d+(\.\d+)?\s*\)|\bspacing:\s*-?\d+(\.\d+)?|\.frame\(\s*(width|height):\s*-?\d+(\.\d+)?)'
    included:
      - 'Attempt/.*\.swift'
      - 'Packages/Features/.*\.swift'
    message: "G-7.7: use a DesignSystem spacing token, not a numeric literal."
    severity: error

  no_swiftdata_outside_persistence:
    name: "SwiftData imported outside Persistence"
    regex: '\bimport[ \t]+SwiftData\b'
    match_kinds:
      - keyword
      - identifier
    excluded:
      - 'Packages/Persistence/.*\.swift'
    message: "TR-0.1.2: only Persistence may import SwiftData. Reach storage through a repository protocol."
    severity: error

  no_bare_save_in_persistence:
    name: "Bare save() in the persistence layer"
    regex: '\bsave\(\)'
    match_kinds:
      - identifier
    included:
      - 'Packages/Persistence/Sources/.*\.swift'
    excluded:
      - 'Packages/Persistence/Sources/Persistence/SaveStamping.swift'
    message: "G-1.2/G-2.4: call saveStamped(at:). A bare save() writes a row whose updatedAt describes the previous write."
    severity: error

  no_hard_delete_outside_purge:
    name: "Hard delete outside the purge routine"
    regex: '\.delete\(|\.deleteAllData\(|\.erase\('
    match_kinds:
      - identifier
    included:
      - 'Packages/Persistence/.*\.swift'
    excluded:
      - 'Packages/Persistence/Sources/Persistence/Purge/.*\.swift'
    message: "G-1.3: deletion is soft — call markDeleted(at:). Hard deletion lives only in Sources/Persistence/Purge/."
    severity: error

  no_foundation_in_core:
    name: "Foundation imported into the domain core"
    regex: '\bimport[ \t]+(Foundation|FoundationEssentials|FoundationNetworking)\b'
    match_kinds:
      - keyword
      - identifier
    included:
      - 'Packages/PowerliftingCore/.*\.swift'
    message: "NFR-0.2: PowerliftingCore is Foundation-free. The Linux CI job cannot catch this — Foundation compiles there. In Sources/ this overlaps no_imports_in_core; in Tests/ it is the only enforcement there is."
    severity: error

  no_imports_in_core:
    name: "Import in the domain core"
    regex: '\bimport[ \t]+\w'
    match_kinds:
      - keyword
      - identifier
    included:
      - 'Packages/PowerliftingCore/Sources/.*\.swift'
    message: "NFR-0.2 (T-0.14): PowerliftingCore/Sources imports nothing at all. `pow` and `exp` are hand-rolled in RealMath.swift rather than importing Darwin or Glibc — read that file's header and T-0.14's notes before adding an import."
    severity: error

reporter: xcode
